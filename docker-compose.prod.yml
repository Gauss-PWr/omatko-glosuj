services:
  db:
    image: postgres:18.0
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: admin
      POSTGRES_DB: omatko_licznik
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    volumes:
      - ./omatko-licznik_postgres_volume:/var/lib/postgresql
      - ./db_password.txt:/run/secrets/db-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d omatko_licznik"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    container_name: backend
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      RUNNING_IN_CONTAINER: "1"
      DB_USER: admin
      DB_NAME: omatko_licznik
      DB_HOST: db
      DB_PORT: 5432
      DB_PASSWORD_FILE: /run/secrets/db-password
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 5555
      FRONTEND_ORIGIN: https://omatko.pwr.edu.pl
    volumes:
      - ./db_password.txt:/run/secrets/db-password:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  frontend:
    container_name: frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    volumes:
      - frontend-static-volume:/app/dist
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-static-volume:/srv/www/omatko-glosuj
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    
secrets:
  db-password:
    file: ./db_password.txt

volumes:
  frontend-static-volume:
    driver: local
