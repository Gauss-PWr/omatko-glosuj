[project]
name = "backend"
version = "2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "black>=25.9.0",
    "crypto>=1.4.1",
    "fastapi>=0.121.0",
    "isort>=7.0.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
